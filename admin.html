<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>야간 보행 인터뷰 관리자</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#eef0f3; --surface:#fbfbfc; --fg:#1b2230; --muted:#5d6676; --line:#d5d9e0;
  --accent:#b86a00; --accent-bg:#fdecd0; --accent-fg:#ffffff; --ok:#1f7a4d; --warn:#a33a2a;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141c; --surface:#192030; --fg:#e8ebf1; --muted:#9aa4b5; --line:#2b3447;
  --accent:#f2b24a; --accent-bg:#3a2d12; --accent-fg:#1a1204; --ok:#6fcf9f; --warn:#f08f7e; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.eyebrow{font:500 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{margin:4px 0 0;font-size:24px;line-height:1.3}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.bar label{display:flex;flex-direction:column;gap:4px;font:500 12px var(--font-mono);color:var(--muted);flex:1 1 200px;min-width:0}
input[type=password],input[type=search]{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.btn{font:inherit;font-size:14px;font-weight:500;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stat{display:flex;gap:16px;flex-wrap:wrap;font:500 13px var(--font-mono);color:var(--muted)}
.stat b{color:var(--fg)}
.msg{font-size:14px;color:var(--warn)}
.msg.ok{color:var(--ok)}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row summary{list-style:none;cursor:pointer;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:12px 16px}
.row summary::-webkit-details-marker{display:none}
.pid{font-weight:700}
.sub{font-size:13px;color:var(--muted)}
.fresh{font:500 11px var(--font-mono);color:var(--accent-fg);background:var(--accent);border-radius:4px;padding:1px 6px;margin-left:8px}
pre{margin:0;padding:14px 16px;border-top:1px solid var(--line);white-space:pre-wrap;word-break:break-word;font:13px/1.7 var(--font-mono)}
.empty{color:var(--muted);padding:24px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">관리자</div>
    <h1>야간 보행 인터뷰 제출 현황</h1>
  </header>
  <div class="bar">
    <label for="key">관리자 비밀번호<input type="password" id="key" autocomplete="off"></label>
    <button class="btn pri" id="load" type="button">불러오기</button>
    <button class="btn" id="copy" type="button">전체 복사</button>
  </div>
  <label class="sub" for="q" style="display:flex;flex-direction:column;gap:4px">참여자 검색<input type="search" id="q" placeholder="참여자 번호, 진행자, 내용" autocomplete="off"></label>
  <div class="stat"><span>제출 <b id="n">0</b>건</span><span>마지막 갱신 <b id="t">-</b></span><span>10초마다 자동 갱신</span></div>
  <div class="msg" id="msg" role="status"></div>
  <div id="list" style="display:flex;flex-direction:column;gap:10px"><div class="empty">비밀번호를 입력하고 불러오기를 누르세요.</div></div>
</div>
<script>
// 응답을 받는 Apps Script 웹 앱 주소 (index.html 의 ENDPOINT 와 같은 값)
const ENDPOINT='';
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let rows=[],timer=null,opened=new Set();
try{$('key').value=sessionStorage.getItem('ivkey')||''}catch(e){}
const fmt=ms=>{const d=new Date(ms);return isNaN(d)?'-':d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})};
function draw(){
  const q=$('q').value.trim().toLowerCase();
  const v=rows.filter(r=>!q||[r.pid,r.interviewer,r.report].join(' ').toLowerCase().includes(q));
  $('n').textContent=rows.length;
  if(!v.length){$('list').innerHTML='<div class="empty">'+(rows.length?'검색 결과가 없습니다.':'아직 제출된 인터뷰가 없습니다.')+'</div>';return}
  $('list').innerHTML=v.map(r=>`<details class="row" data-sid="${esc(r.sid)}" ${opened.has(r.sid)?'open':''}><summary><span><span class="pid">${esc(r.pid||'번호 없음')}</span>${Date.now()-r.updatedAt<120000?'<span class="fresh">방금</span>':''}<br><span class="sub">${esc(r.interviewer||'진행자 미입력')} · ${esc(r.date||'날짜 미입력')}</span></span><span class="sub">${fmt(r.updatedAt)} 갱신</span></summary><pre>${esc(r.report)}</pre></details>`).join('');
}
async function load(manual){
  if(!ENDPOINT){$('msg').textContent='ENDPOINT 주소가 아직 설정되지 않았습니다.';return}
  const k=$('key').value;if(!k){$('msg').textContent='관리자 비밀번호를 입력해 주세요.';return}
  try{
    const res=await fetch(ENDPOINT+'?key='+encodeURIComponent(k));
    const j=await res.json();
    if(j.error){$('msg').textContent='비밀번호가 맞지 않습니다.';clearInterval(timer);timer=null;return}
    rows=(j.rows||[]).sort((a,b)=>b.updatedAt-a.updatedAt);
    $('msg').textContent='';$('t').textContent=new Date().toLocaleTimeString('ko-KR');
    try{sessionStorage.setItem('ivkey',k)}catch(e){}
    draw();
    if(!timer)timer=setInterval(()=>load(false),10000);
  }catch(e){$('msg').textContent='불러오지 못했습니다. 인터넷 연결과 주소를 확인해 주세요.'}
}
$('load').onclick=()=>load(true);
$('key').addEventListener('keydown',e=>{if(e.key==='Enter')load(true)});
$('q').addEventListener('input',draw);
$('list').addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.sid){d.open?opened.add(d.dataset.sid):opened.delete(d.dataset.sid)}},true);
$('copy').onclick=async()=>{
  const txt=rows.map(r=>r.report).join('\n\n==========\n\n');
  try{await navigator.clipboard.writeText(txt);$('msg').className='msg ok';$('msg').textContent='전체 응답을 복사했습니다.'}
  catch(e){$('msg').className='msg';$('msg').textContent='복사하지 못했습니다. 각 기록을 직접 선택해 복사해 주세요.'}
};
if($('key').value)load(false);
</script>
</body>
</html>
